name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: terraform-dev-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GH_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform fmt (check)
        run: terraform -chdir=terraform fmt -check -recursive

      - name: TFLint
        run: |
          tflint --init
          tflint --chdir=terraform/environments/dev --recursive

      - name: Terraform init
        run: |
          terraform -chdir=terraform/environments/dev init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="access_key=${{ secrets.CF_R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.CF_R2_SECRET_ACCESS_KEY }}" \
            -backend-config='endpoints={s3="https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"}' \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true"

      - name: Terraform validate
        run: terraform -chdir=terraform/environments/dev validate -no-color

      - name: Terraform plan
        run: terraform -chdir=terraform/environments/dev plan -input=false -no-color -out=tfplan

      - name: Terraform plan summary
        run: terraform -chdir=terraform/environments/dev show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: terraform/environments/dev/plan.txt
          if-no-files-found: error

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'terraform/environments/dev/plan.txt';
            const plan = fs.readFileSync(path, 'utf8');
            const body = [
              '## Terraform Plan (dev)',
              '',
              '```text',
              plan.length > 60000 ? plan.substring(0, 60000) + '\n...truncated...' : plan,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
