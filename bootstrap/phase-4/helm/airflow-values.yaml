# Apache Airflow Helm chart values (spec §3.6).
# Uses KubernetesExecutor + external PostgreSQL (CNPG `pg-airflow`).
executor: KubernetesExecutor

postgresql:
  enabled: false

data:
  metadataConnection:
    user: airflow
    pass: airflow
    protocol: postgresql
    host: pg-airflow-rw.platform-storage.svc.cluster.local
    port: 5432
    db: airflow_metadata
    sslmode: disable

# DAGs are loaded from a ConfigMap mounted at /opt/airflow/dags
# (see extraVolumeMounts/extraVolumes below). For production, switch to gitSync.
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# Mount the airflow-dags ConfigMap (built by scripts/prepare-airflow-dags.sh)
# into every Airflow pod that needs DAG access (scheduler, webserver, worker, triggerer).
extraVolumes:
  - name: airflow-dags-cm
    configMap:
      name: airflow-dags
      defaultMode: 0o555
extraVolumeMounts:
  - name: airflow-dags-cm
    mountPath: /opt/airflow/dags
    readOnly: true

# Pre-install required Airflow providers (CNCF Kubernetes for SparkKubernetesOperator/Sensor).
extraPipPackages:
  - "apache-airflow-providers-cncf-kubernetes>=8.0.0,<9.0.0"

webserver:
  defaultUser:
    enabled: true
    username: admin
    role: Admin
    email: admin@example.com
    firstName: admin
    lastName: admin
    password: admin

triggerer:
  persistence:
    enabled: false

logs:
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

workers:
  persistence:
    enabled: false

ingress:
  enabled: false

nodeSelector:
  workload: compute

tolerations: []
