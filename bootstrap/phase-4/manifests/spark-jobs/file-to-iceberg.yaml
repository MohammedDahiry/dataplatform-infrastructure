# Batch Spark job: read XLSX/CSV files from MinIO landing -> Iceberg bronze.
# PySpark code lives in /opt/jobs/file_ingestion.py inside the image.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: file-to-iceberg-ingestion
  namespace: platform-compute
  labels:
    app.kubernetes.io/part-of: dataplatform
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: REPLACE_ME_REGISTRY/dataplatform/spark-iceberg:3.5.0
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/jobs/file_ingestion.py"
  sparkVersion: "3.5.0"
  arguments:
    - "--source-path=s3a://landing/files/*.xlsx"
    - "--target-table=lakehouse.bronze.raw_files"
    - "--file-format=xlsx"
  sparkConf:
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.lakehouse": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.lakehouse.type": "hive"
    "spark.sql.catalog.lakehouse.uri": "thrift://hive-metastore.platform-metastore.svc.cluster.local:9083"
    "spark.sql.catalog.lakehouse.warehouse": "s3a://lakehouse/warehouse/"
    "spark.hadoop.fs.s3a.endpoint": "http://lakehouse-tenant-hl.platform-storage.svc.cluster.local:9000"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
  driver:
    cores: 1
    coreLimit: "1500m"
    memory: "2g"
    serviceAccount: spark-sa
    envSecretKeyRefs:
      MINIO_ACCESS_KEY:
        name: minio-admin-secret
        key: accessKey
      MINIO_SECRET_KEY:
        name: minio-admin-secret
        key: secretKey
    nodeSelector:
      workload: compute
  executor:
    cores: 1
    instances: 1
    memory: "2g"
    serviceAccount: spark-sa
    envSecretKeyRefs:
      MINIO_ACCESS_KEY:
        name: minio-admin-secret
        key: accessKey
      MINIO_SECRET_KEY:
        name: minio-admin-secret
        key: secretKey
    nodeSelector:
      workload: compute
  restartPolicy:
    type: Never
