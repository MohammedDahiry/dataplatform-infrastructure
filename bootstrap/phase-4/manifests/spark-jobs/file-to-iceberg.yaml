# Batch Spark job: read XLSX/CSV files from MinIO landing -> Iceberg bronze.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: file-to-iceberg-ingestion
  namespace: platform-compute
  labels:
    app.kubernetes.io/part-of: dataplatform
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: REPLACE_ME_REGISTRY/spark-iceberg:3.5.0
  imagePullPolicy: Always
  mainApplicationFile: "s3a://jobs/file_ingestion.py"
  sparkVersion: "3.5.0"
  arguments:
    - "--source-path=s3a://landing/files/"
    - "--target-table=lakehouse.bronze.raw_files"
    - "--file-format=xlsx"
  sparkConf:
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.lakehouse": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.lakehouse.type": "hive"
    "spark.sql.catalog.lakehouse.uri": "thrift://hive-metastore.platform-metastore.svc.cluster.local:9083"
    "spark.sql.catalog.lakehouse.warehouse": "s3a://lakehouse/warehouse/"
    "spark.hadoop.fs.s3a.endpoint": "http://lakehouse-tenant-hl.platform-storage.svc.cluster.local:9000"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.jars.packages": "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.4.2,com.crealytics:spark-excel_2.12:3.5.0_0.20.3"
  driver:
    cores: 1
    coreLimit: "1500m"
    memory: "2g"
    serviceAccount: spark-sa
    nodeSelector:
      workload: compute
  executor:
    cores: 1
    instances: 1
    memory: "2g"
    serviceAccount: spark-sa
    nodeSelector:
      workload: compute
