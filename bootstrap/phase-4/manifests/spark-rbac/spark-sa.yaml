apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-sa
  namespace: platform-compute
  labels:
    app.kubernetes.io/part-of: dataplatform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: platform-compute
  labels:
    app.kubernetes.io/part-of: dataplatform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-rb
  namespace: platform-compute
  labels:
    app.kubernetes.io/part-of: dataplatform
subjects:
  - kind: ServiceAccount
    name: spark-sa
    namespace: platform-compute
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
