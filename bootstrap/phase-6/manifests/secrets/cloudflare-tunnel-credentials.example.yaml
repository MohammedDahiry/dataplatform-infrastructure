apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: platform-security
type: Opaque
stringData:
  credentials.json: |
    {
      "AccountTag": "REPLACE_ME_CF_ACCOUNT_ID",
      "TunnelSecret": "REPLACE_ME_BASE64_TUNNEL_SECRET",
      "TunnelID": "REPLACE_ME_TUNNEL_UUID"
    }
