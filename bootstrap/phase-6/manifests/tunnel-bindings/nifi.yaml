apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: nifi-tunnel
  namespace: platform-ingestion
spec:
  subjects:
    - name: nifi
      spec:
        fqdn: nifi.dataplatform.REPLACE_ME_ZONE_EXAMPLE_COM
        protocol: http
        servicePort: 8080
        noTLSVerify: false
  tunnelRef:
    kind: ClusterTunnel
    name: platform-cloudflare-tunnel
