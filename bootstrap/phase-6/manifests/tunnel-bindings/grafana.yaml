apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: grafana-tunnel
  namespace: platform-monitoring
spec:
  subjects:
    - name: monitoring-grafana
      spec:
        fqdn: grafana.dataplatform.REPLACE_ME_ZONE_EXAMPLE_COM
        protocol: http
        servicePort: 80
        noTLSVerify: false
  tunnelRef:
    kind: ClusterTunnel
    name: platform-cloudflare-tunnel
