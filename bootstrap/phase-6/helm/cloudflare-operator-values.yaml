# Cloudflare Operator values (spec §7.2). Token + accountId come from the secret
# applied separately so we never commit credentials.
config:
  apiToken:
    secretName: cloudflare-api-token
    secretKey: token
  accountId: REPLACE_ME_CF_ACCOUNT_ID

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  workload: compute
