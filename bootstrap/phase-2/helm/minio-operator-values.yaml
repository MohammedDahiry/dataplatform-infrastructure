operator:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  tolerations:
    - key: workload
      operator: Equal
      value: stateful
      effect: NoSchedule

console:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  tolerations:
    - key: workload
      operator: Equal
      value: stateful
      effect: NoSchedule