# cert-manager (Jetstack) — TLS prerequisite for operators / ingress (spec Phase 2).
# Per Specifications_Doc_for_PFE.pdf §2.2, cert-manager runs in the platform-security
# namespace alongside the Cloudflare Operator.

crds:
  enabled: true

global:
  leaderElection:
    namespace: platform-security

# Controller resources (required by namespace-default-quota on EKS)
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

tolerations:
  - key: workload
    operator: Equal
    value: stateful
    effect: NoSchedule

cainjector:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi
  tolerations:
    - key: workload
      operator: Equal
      value: stateful
      effect: NoSchedule

webhook:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  tolerations:
    - key: workload
      operator: Equal
      value: stateful
      effect: NoSchedule

startupapicheck:
  enabled: false