apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-source-cluster
  namespace: platform-storage
  labels:
    app.kubernetes.io/part-of: dataplatform
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  affinity:
    tolerations:
      - key: workload
        operator: Equal
        value: stateful
        effect: NoSchedule
  postgresql:
    parameters:
      wal_level: logical
      max_replication_slots: "20"
      max_wal_senders: "20"
    shared_preload_libraries:
      - pgaudit
      - pg_stat_statements
  bootstrap:
    initdb:
      database: source_db
      owner: nifi_user
      secret:
        name: pg-source-app-secret
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        - "ALTER ROLE nifi_user WITH REPLICATION;"
        - "CREATE PUBLICATION debezium_pub FOR ALL TABLES;"
  storage:
    storageClass: gp3
    size: 100Gi
