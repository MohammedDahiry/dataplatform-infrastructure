# Dremio Nautilus (community Helm chart). Values tuned for a small dev cluster.
# Override coordinator/executor counts and memory/cpu for production.
image: dremio/dremio-oss
imageTag: "25.0.0"

coordinator:
  count: 1
  cpu: 1
  memory: 4096
  volumeSize: 30Gi
  storageClass: gp3
  nodeSelector:
    workload: compute
  tolerations: []

executor:
  count: 1
  cpu: 1
  memory: 4096
  volumeSize: 30Gi
  storageClass: gp3
  nodeSelector:
    workload: compute
  tolerations: []
  engineOverride: []

zookeeper:
  count: 1
  cpu: 0.25
  memory: 512
  volumeSize: 10Gi
  storageClass: gp3

distStorage:
  type: aws
  aws:
    bucketName: lakehouse
    path: /dremio
    authentication: accessKeySecret
    credentials:
      accessKey: REPLACE_ME
      secret: REPLACE_ME
    extraProperties: |
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://lakehouse-tenant-hl.platform-storage.svc.cluster.local:9000</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
