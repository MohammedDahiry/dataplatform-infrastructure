apiVersion: v1
kind: Service
metadata:
  name: nifi
  namespace: platform-ingestion
  labels:
    app: nifi
spec:
  type: ClusterIP
  selector:
    app: nifi
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: platform-ingestion
  labels:
    app.kubernetes.io/part-of: dataplatform
spec:
  serviceName: nifi
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  template:
    metadata:
      labels:
        app: nifi
    spec:
      containers:
        - name: nifi
          image: apache/nifi:1.27.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NIFI_WEB_HTTP_PORT
              value: "8080"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/state
  volumeClaimTemplates:
    - metadata:
        name: nifi-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
