# Dev-friendly Strimzi Kafka cluster: single broker + single ZK, smaller PVCs.
# Use this instead of strimzi-kafka.yaml when running on a small cluster
# (compute-ng=1 node) for soutenance demos. Production sizing lives in
# strimzi-kafka.yaml (3 brokers + 3 ZK, 200/50 Gi).
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: platform-kafka
  namespace: platform-ingestion
  labels:
    app.kubernetes.io/part-of: dataplatform
    app.kubernetes.io/variant: dev
spec:
  kafka:
    version: 3.9.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 168
    storage:
      type: persistent-claim
      class: gp3
      size: 30Gi
      deleteClaim: false
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 3Gi
  zookeeper:
    replicas: 1
    storage:
      type: persistent-claim
      class: gp3
      size: 10Gi
      deleteClaim: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  entityOperator:
    topicOperator: {}
    userOperator: {}
