# Debezium-enabled KafkaConnect for CDC (PostgreSQL logical replication).
# The image is built once and pushed to ECR; here we reference the public
# debezium/connect image as a starting point for the soutenance demo.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: platform-connect
  namespace: platform-ingestion
  labels:
    app.kubernetes.io/part-of: dataplatform
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 3.7.0
  replicas: 1
  bootstrapServers: platform-kafka-kafka-bootstrap:9092
  image: quay.io/debezium/connect:2.7.0.Final
  config:
    group.id: platform-connect-cluster
    offset.storage.topic: platform-connect-cluster-offsets
    config.storage.topic: platform-connect-cluster-configs
    status.storage.topic: platform-connect-cluster-status
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider
  externalConfiguration:
    volumes:
      - name: pg-source-app-secret
        secret:
          secretName: pg-source-app-secret
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: pg-source-cdc
  namespace: platform-ingestion
  labels:
    strimzi.io/cluster: platform-connect
    app.kubernetes.io/part-of: dataplatform
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: pg-source-cluster-rw.platform-storage.svc.cluster.local
    database.port: 5432
    database.user: nifi_user
    # Strimzi mounts the pg-source-app-secret at /opt/kafka/external-configuration/pg-source-app-secret/
    database.password: ${file:/opt/kafka/external-configuration/pg-source-app-secret/password}
    database.dbname: source_db
    database.server.name: pgsrc
    plugin.name: pgoutput
    slot.name: debezium_slot
    publication.name: debezium_pub
    topic.prefix: cdc.pg
    schema.include.list: public
    table.include.list: public.agency_budget,public.clients
    snapshot.mode: initial
