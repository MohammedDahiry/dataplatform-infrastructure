# Fluent Bit DaemonSet shipping container logs to OpenObserve over HTTP.
# (Spec §9.3 also documents an S3 buffer; we keep the simpler direct path for MVP
# and can switch to S3 + OpenObserve ingestion later.)
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker,cri
        Tag kube.*
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name http
        Match kube.*
        Host openobserve.platform-logging.svc.cluster.local
        Port 5080
        URI /api/default/k8s/_json
        Format json
        Json_date_key  _timestamp
        Json_date_format iso8601
        HTTP_User admin@dataplatform.local
        HTTP_Passwd REPLACE_ME_OPENOBSERVE_ADMIN_PASSWORD
        tls Off
        tls.verify Off

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
