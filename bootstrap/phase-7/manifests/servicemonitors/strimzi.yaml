apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: strimzi-kafka-pods
  namespace: platform-monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: dataplatform
spec:
  selector:
    matchLabels:
      strimzi.io/cluster: platform-kafka
  namespaceSelector:
    matchNames: ["platform-ingestion"]
  podMetricsEndpoints:
    - port: tcp-prometheus
      interval: 30s
