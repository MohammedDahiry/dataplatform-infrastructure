apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-pods
  namespace: platform-monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: dataplatform
spec:
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  namespaceSelector:
    matchNames: ["platform-storage", "platform-metastore"]
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
