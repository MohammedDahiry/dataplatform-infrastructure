name: "lakehouse"
version: "0.1.0"
config-version: 2

profile: "lakehouse"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  lakehouse:
    silver:
      +materialized: incremental
      +file_format: iceberg
      +schema: silver
    gold:
      +materialized: table
      +file_format: iceberg
      +schema: gold
